name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  CLOUD_RUN_SERVICE: menugo-backend
  IMAGE_NAME: menugo-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Extract GCP project info
        run: |
          PROJECT_ID=$(echo '${{ secrets.GCP_SA_KEY }}' | jq -r '.project_id')
          echo "GCP_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "GCP_REGION=${{ secrets.GCP_REGION }}" >> "$GITHUB_ENV"
          echo "GAR_REPO=${{ secrets.GAR_REPO }}" >> "$GITHUB_ENV"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Parse env vars
        id: envvars
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > /tmp/.env

          # Build multiline KEY=VALUE output, stripping reserved vars and comments
          {
            echo "vars<<ENVEOF"
            while IFS= read -r line; do
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              [[ -z "${line// }" ]] && continue
              key="${line%%=*}"
              case "$key" in
                PORT|NODE_ENV|K_SERVICE|K_REVISION|K_CONFIGURATION) continue ;;
              esac
              echo "$line"
            done < /tmp/.env
            echo "ENVEOF"
          } >> "$GITHUB_OUTPUT"

          rm /tmp/.env

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          # Build --set-env-vars flags using @ delimiter (won't appear in values)
          ENV_ARGS=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [ -z "$ENV_ARGS" ]; then
              ENV_ARGS="$line"
            else
              ENV_ARGS="${ENV_ARGS}@${line}"
            fi
          done <<< "${{ steps.envvars.outputs.vars }}"

          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE" \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --concurrency=80 \
            --set-env-vars "^@^${ENV_ARGS}"
