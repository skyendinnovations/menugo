name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  CLOUD_RUN_SERVICE: menugo-backend
  IMAGE_NAME: menugo-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Extract GCP project info
        run: |
          PROJECT_ID=$(echo '${{ secrets.GCP_SA_KEY }}' | jq -r '.project_id')
          echo "GCP_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "GCP_REGION=${{ secrets.GCP_REGION }}" >> "$GITHUB_ENV"
          echo "GAR_REPO=${{ secrets.GAR_REPO }}" >> "$GITHUB_ENV"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Generate env vars YAML for Cloud Run
        run: |
          echo "${{ secrets.BACKEND_ENV }}" > /tmp/.env

          # Convert .env to YAML, skipping comments, blank lines, and Cloud Run reserved vars (PORT, K_SERVICE, etc.)
          echo "" > /tmp/env.yaml
          while IFS= read -r line; do
            # Skip comments and blank lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line// }" ]] && continue

            # Extract key and value
            key="${line%%=*}"
            value="${line#*=}"

            # Skip Cloud Run reserved env vars
            case "$key" in
              PORT|K_SERVICE|K_REVISION|K_CONFIGURATION) continue ;;
            esac

            # Write as YAML (quote value to handle commas, special chars)
            echo "$key: \"$value\"" >> /tmp/env.yaml
          done < /tmp/.env

          rm /tmp/.env

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars_file: /tmp/env.yaml
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --concurrency=80
